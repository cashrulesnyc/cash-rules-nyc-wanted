<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CR NYC">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>CASH RULES NYC: WANTED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--g:#1fd65f;--gold:#e8b923;--red:#ff3b3b;--ink:#0b0d10;--glass:rgba(12,14,18,.82);--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0d10;color:#fff;font-family:'Russo One',system-ui,-apple-system,'Segoe UI',sans-serif;touch-action:none;overscroll-behavior:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.disp{font-family:'Bungee',Impact,'Arial Black',sans-serif;letter-spacing:.02em}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
#touch{position:fixed;inset:0;z-index:2}
.tind{position:fixed;bottom:calc(18px + var(--safe-b));width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.55;z-index:3;pointer-events:none;transition:transform .08s,background .08s}
#tl{left:calc(18px + var(--safe-l))}#tr{right:calc(18px + var(--safe-r))}
.tind.on{background:rgba(31,214,95,.55);transform:scale(1.12);opacity:.95}
#hud{position:fixed;inset:0;pointer-events:none;z-index:4;display:none}
#hud.on{display:block}
#topl{position:absolute;left:calc(12px + var(--safe-l));top:calc(10px + var(--safe-t));display:flex;flex-direction:column;gap:4px}
#stars{font-size:30px;line-height:1;display:flex;gap:1px;filter:drop-shadow(0 2px 0 #000)}
#stars i{font-style:normal;color:rgba(255,255,255,.22);-webkit-text-stroke:1.5px #000}
#stars i.on{color:#ffd23a}
#stars i.fl{color:#ff3b3b}
#cash{font-family:'Bungee',Impact,sans-serif;font-size:24px;color:var(--g);text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.5);-webkit-text-stroke:1px #000}
#hpw{width:150px;height:9px;background:rgba(0,0,0,.55);border:2px solid #000;border-radius:5px;overflow:hidden}
#hpbar{height:100%;width:100%;background:#2ee66f;transition:width .15s}
#timer{font-size:14px;opacity:.9;text-shadow:0 1px 0 #000}
#mini{position:absolute;right:calc(10px + var(--safe-r));top:calc(10px + var(--safe-t));width:128px;height:128px;border-radius:50%;pointer-events:auto;box-shadow:0 3px 0 #000,0 0 0 3px rgba(255,255,255,.85)}
#pauseBtn{position:absolute;right:calc(10px + var(--safe-r));top:calc(146px + var(--safe-t));width:40px;height:40px;border-radius:12px;background:var(--glass);font-size:16px;pointer-events:auto;border:2px solid rgba(255,255,255,.25)}
#loc{position:absolute;left:50%;bottom:calc(98px + var(--safe-b));transform:translateX(-50%);text-align:center;font-family:'Bungee',Impact,sans-serif;font-size:22px;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.6);opacity:0;white-space:nowrap}
#loc small{display:block;font-family:'Russo One',sans-serif;font-size:12px;letter-spacing:.25em;color:var(--gold)}
#loc.on{animation:loc 3.2s ease forwards}
@keyframes loc{0%{opacity:0;transform:translate(-50%,10px)}10%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0}}
#hint{position:absolute;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%);background:var(--glass);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;white-space:nowrap;border:1px solid rgba(255,255,255,.15)}
#hint.on{opacity:1}
#big{position:fixed;left:0;right:0;top:32%;text-align:center;font-family:'Bungee',Impact,sans-serif;font-size:44px;z-index:6;pointer-events:none;opacity:0;text-shadow:0 4px 0 #000,0 0 20px rgba(0,0,0,.6);-webkit-text-stroke:2px #000}
#big.on{animation:big 1.8s ease forwards}
#big.stars{color:#ffd23a;font-size:54px}#big.cool{color:var(--g)}
@keyframes big{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.95)}}
#toast{position:fixed;left:50%;top:calc(196px + var(--safe-t));transform:translateX(-50%);z-index:6;background:var(--glass);padding:8px 14px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;max-width:88vw;text-align:center;border:1px solid rgba(31,214,95,.5)}
#toast.on{animation:toast 3.4s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-8px)}8%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
#cashPop{position:fixed;left:calc(14px + var(--safe-l));top:calc(96px + var(--safe-t));z-index:5;font-family:'Bungee',Impact,sans-serif;color:var(--g);font-size:18px;opacity:0;pointer-events:none;-webkit-text-stroke:1px #000;text-shadow:0 2px 0 #000}
#cashPop.on{animation:pop .9s ease forwards}
@keyframes pop{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-18px)}}
#flash{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0}
#flash.on{animation:fl .5s ease forwards}@keyframes fl{0%{opacity:.75}100%{opacity:0}}
/* overlays */
.ov{position:fixed;inset:0;z-index:10;display:none}
.ov.on{display:flex}
#title{flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,rgba(5,6,8,.75) 0%,rgba(5,6,8,0) 30%,rgba(5,6,8,0) 45%,rgba(5,6,8,.92) 75%);padding:calc(16px + var(--safe-t)) calc(16px + var(--safe-r)) calc(16px + var(--safe-b)) calc(16px + var(--safe-l))}
.logo{text-align:center;margin-top:6px}
.logo .l1{font-family:'Bungee',Impact,sans-serif;font-size:clamp(30px,9vw,58px);line-height:.95;color:var(--g);-webkit-text-stroke:2px #000;text-shadow:0 5px 0 #000}
.logo .l1 span{color:var(--gold)}
.logo .l2{display:inline-block;margin-top:8px;font-family:'Bungee',Impact,sans-serif;font-size:clamp(22px,6vw,34px);background:var(--red);color:#fff;padding:2px 14px 0;border:3px solid #000;transform:rotate(-3deg);box-shadow:0 4px 0 #000}
.logo .l3{margin-top:8px;color:#ffd23a;font-size:20px;letter-spacing:4px;-webkit-text-stroke:1px #000}
.toprow{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.95}
.pill{background:var(--glass);border:2px solid rgba(255,255,255,.2);padding:5px 10px;border-radius:20px}
#bank{color:var(--g);font-family:'Bungee',Impact,sans-serif}
.panel{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.stat{display:flex;flex-direction:column;gap:3px;font-size:10px;letter-spacing:.1em;opacity:.9;width:80px}
.stat i{display:block;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.stat b{display:block;height:100%;background:var(--g)}
#boros{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#boros button{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.2);padding:12px 10px;border-radius:12px;font-size:13px}
#boros button.sel{border-color:var(--g);color:var(--g);background:rgba(31,214,95,.12)}
#playBtn{font-family:'Bungee',Impact,sans-serif;font-size:28px;padding:12px;border-radius:16px;background:var(--g);color:#06140a;border:3px solid #000;box-shadow:0 6px 0 #000;transition:transform .05s}
#playBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
#playBtn:disabled{background:#3b4a40;color:#9fb3a5}
#playBtn[data-mode=buy]{background:var(--gold)}
#missions{z-index:20;align-items:flex-end;justify-content:center;background:rgba(5,6,8,.6)}
#missions .sheet{max-height:82vh;display:flex;flex-direction:column;gap:8px;padding-bottom:calc(14px + var(--safe-b))}
.mhead{display:flex;align-items:center;gap:8px;justify-content:space-between;position:sticky;top:-14px;background:rgba(12,14,18,.96);padding:6px 0;z-index:1}
.mhead .disp{font-size:20px;color:var(--g)}
#misClose{background:rgba(255,255,255,.1);border-radius:10px;width:36px;height:36px;font-size:16px}
#misList{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.mrow.ready{border-color:var(--g);background:rgba(31,214,95,.12)}
.mrow.gift{border-color:rgba(232,185,35,.5)}
.mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mt b{font-family:'Bungee',Impact,sans-serif;font-size:13px;font-weight:400}
.mt small{font-size:10px;opacity:.6;letter-spacing:.08em}
.mt span{font-size:11px;opacity:.8}
.mbar{height:8px;background:rgba(0,0,0,.5);border-radius:5px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--g)}
.gift .mbar i{background:var(--gold)}
.mclaim{font-size:12px;padding:8px 10px;min-width:96px}
.opts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.opts button{background:transparent;border:2px solid rgba(255,255,255,.2);padding:6px 10px;border-radius:10px;font-size:11px;opacity:.75}
.opts button.sel{border-color:var(--gold);color:var(--gold);opacity:1}
.tip{text-align:center;font-size:11.5px;opacity:.7;line-height:1.5}
.upg{display:flex;gap:6px}
.upg button{flex:1;background:#141820;border:2px solid rgba(255,255,255,.25);border-radius:12px;padding:7px 6px;font-size:12px;display:flex;gap:6px;align-items:center;justify-content:center}
.upg button small{opacity:.6;font-size:10px}.upg button b{color:var(--g)}
.upg button:disabled{opacity:.45}
.sheet{width:100%;max-width:560px;max-height:66vh;overflow:auto;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.12);border-bottom:0;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + var(--safe-b));display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
.hotstars{color:#ffd23a;font-size:16px}.cool{color:var(--g)}
.btn{font-family:'Bungee',Impact,sans-serif;background:var(--g);color:#06140a;border:2px solid #000;border-radius:12px;padding:10px;font-size:15px;box-shadow:0 4px 0 #000}
.btn:disabled{background:#3b4a40;color:#9fb3a5;box-shadow:0 4px 0 #000}
.btn.alt{background:#fff;color:#111}

/* minimal home */
#boroBtn{align-self:center;background:var(--glass);border:2px solid rgba(255,255,255,.22);border-radius:20px;padding:7px 16px;font-size:12px;letter-spacing:.06em}
#boroBtn b{color:var(--g);margin:0 4px}
.dock{display:flex;gap:10px;justify-content:center}
.dock button{position:relative;flex:1;max-width:120px;background:var(--glass);border:2px solid rgba(255,255,255,.18);border-radius:16px;padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'Bungee',Impact,sans-serif;font-size:11px}
.dock svg{width:26px;height:26px}
#garBtn{color:var(--g)}#misBtn{color:var(--gold)}#setBtn{color:#cfd6de}
.dock #misBadge{position:absolute;top:-7px;right:-5px;font-style:normal;background:var(--red);color:#fff;border-radius:11px;min-width:22px;height:22px;padding:0 6px;font-size:12px;font-family:'Russo One',sans-serif;display:none;align-items:center;justify-content:center;border:2px solid #000}
.sheetov{z-index:20;align-items:flex-end;justify-content:center;background:rgba(5,6,8,.55)}
.sheetov .sheet{display:flex;flex-direction:column;gap:12px;padding-bottom:calc(18px + var(--safe-b))}
.xbtn{background:rgba(255,255,255,.1);border-radius:10px;width:36px;height:36px;font-size:16px}
#settings .opts button{padding:10px 14px;font-size:12px}
/* garage */
#garage{flex-direction:column;justify-content:space-between;pointer-events:none;background:linear-gradient(180deg,rgba(5,6,8,.55) 0%,rgba(5,6,8,0) 16%,rgba(5,6,8,0) 52%,rgba(5,6,8,.88) 74%);padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) calc(14px + var(--safe-b)) calc(12px + var(--safe-l))}
#garage>*{pointer-events:auto}
.gtop{display:flex;align-items:center;gap:10px}
#garBack{width:44px;height:44px;border-radius:12px;background:var(--glass);border:2px solid rgba(255,255,255,.25);font-size:18px}
.gt{flex:1;display:flex;flex-direction:column;line-height:1.1}
.gt b{font-family:'Bungee',Impact,sans-serif;font-size:20px;color:var(--g)}
.gt span{font-size:11px;letter-spacing:.12em;color:var(--gold)}
.gpanel{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.gcar{display:flex;align-items:center;gap:8px}
.gcar button{width:46px;height:46px;border-radius:12px;background:var(--glass);border:2px solid rgba(255,255,255,.25);font-size:20px}
.gcar .mid{flex:1;text-align:center}
#garName{font-family:'Bungee',Impact,sans-serif;font-size:21px}
#garName small{display:block;font-family:'Russo One',sans-serif;font-size:11px;letter-spacing:.12em;color:var(--gold);margin-top:2px}
#garStats{display:flex;gap:10px;justify-content:center;margin-top:6px}
#garAct{font-size:20px;padding:11px}
#garAct.buy{background:var(--gold)}
#garAct.cur{background:#26302a;color:var(--g)}
#garUp{background:#141820;border:2px dashed rgba(232,185,35,.55);color:var(--gold);border-radius:12px;padding:8px;font-size:11.5px;letter-spacing:.04em}
#garUp:disabled{opacity:.5}
/* pause / over */
#pause,#over{align-items:center;justify-content:center;background:rgba(5,6,8,.78);flex-direction:column;gap:14px;padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b))}
#bigmap{width:min(92vw,560px);height:min(56vh,560px);border-radius:16px;border:3px solid #000;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.row{display:flex;gap:10px}
.ot{font-family:'Bungee',Impact,sans-serif;font-size:clamp(40px,13vw,80px);text-align:center;line-height:1;-webkit-text-stroke:3px #000;text-shadow:0 6px 0 #000}
.ot.wasted{color:#ff3b3b}.ot.busted{color:#3a8bff}.ot.splash{color:#62d0ff;font-size:clamp(30px,9vw,56px);-webkit-text-stroke:2px #000}
#overStats{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;width:100%}
#overStats>div{background:rgba(255,255,255,.07);border-radius:12px;padding:10px;text-align:center}
#overStats b{display:block;font-family:'Bungee',Impact,sans-serif;font-size:22px;color:var(--g)}
#overStats span{font-size:10px;letter-spacing:.15em;opacity:.7}
#overStats .best,#overStats .keep{grid-column:1/3;color:var(--gold);font-size:14px}
#overStats .keep{color:var(--g)}
#rotate{display:none;position:fixed;inset:0;z-index:98;background:#0b0d10;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;font-family:'Bungee',Impact,sans-serif}
#rotate .ph{width:54px;height:92px;border:4px solid var(--g);border-radius:12px;animation:rot 1.8s ease-in-out infinite}
#rotate b{font-size:22px;letter-spacing:.04em}
@keyframes rot{0%,20%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
#err{display:none;position:fixed;inset:0;z-index:99;background:#111;color:#fff;padding:40px 20px;font-size:16px;text-align:center}
@media (min-width:900px){#mini{width:170px;height:170px}#pauseBtn{top:calc(190px + var(--safe-t))}#stars{font-size:36px}.tind{display:none}}
@media (max-height:500px) and (orientation:landscape){
#title{flex-direction:row;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(90deg,rgba(5,6,8,.15) 0%,rgba(5,6,8,0) 40%,rgba(5,6,8,.9) 62%)}
#title>div:first-child{width:42%;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.toprow{position:absolute;top:calc(10px + var(--safe-t));left:calc(14px + var(--safe-l))}
.logo .l1{font-size:34px}.logo .l2{font-size:22px}.logo .l3{font-size:16px}
.panel{width:52%;max-width:440px;margin:0;gap:7px}
#playBtn{font-size:22px;padding:8px}.dock button{padding:6px 4px}.dock svg{width:20px;height:20px}
#garage{background:linear-gradient(90deg,rgba(5,6,8,0) 45%,rgba(5,6,8,.85) 66%)}.gpanel{position:absolute;right:calc(14px + var(--safe-r));bottom:calc(10px + var(--safe-b));width:44%;gap:6px}#garAct{font-size:16px;padding:7px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="touch"></div>
<div id="hud">
  <div class="tind" id="tl">◀</div><div class="tind" id="tr">▶</div>
  <div id="topl"><div id="stars"></div><div id="cash">$0</div><div id="hpw"><div id="hpbar"></div></div><div id="timer">0:00</div></div>
  <button id="pauseBtn" aria-label="Pause">❚❚</button>
  <canvas id="mini"></canvas>
  <div id="hint"></div>
  <div id="loc"></div>
</div>
<div id="cashPop"></div><div id="toast"></div><div id="big" class="big"></div><div id="flash"></div>

<div id="title" class="ov">
  <div>
    <div class="toprow"><span class="pill" id="best"></span><span class="pill">BANK <b id="bank">$0</b></span></div>
    <div class="logo"><div class="l1">CASH RULES <span>NYC</span></div><div class="l2">WANTED</div><div class="l3">★★★★★</div></div>
  </div>
  <div class="panel">
    <button id="boroBtn">START IN <b id="boroName">MANHATTAN</b> ▾</button>
    <button id="playBtn">PLAY</button>
    <div class="dock"><button id="garBtn"><svg viewBox="0 0 24 24"><path d="M4 15l1.6-5.2A2 2 0 0 1 7.5 8.4h9a2 2 0 0 1 1.9 1.4L20 15v4h-2.4v-1.6H6.4V19H4z" fill="currentColor"/><circle cx="7.5" cy="15" r="1.4" fill="#000"/><circle cx="16.5" cy="15" r="1.4" fill="#000"/></svg><span>GARAGE</span></button><button id="misBtn"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2" fill="currentColor"/><circle cx="12" cy="12" r="3.2" fill="#000"/><text x="12" y="14.2" font-size="5.5" text-anchor="middle" fill="currentColor" font-family="Arial" font-weight="bold">$</text></svg><span>HUSTLES</span><i id="misBadge"></i></button><button id="setBtn"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="2.6" rx="1.3" fill="currentColor"/><rect x="4" y="10.7" width="16" height="2.6" rx="1.3" fill="currentColor"/><rect x="4" y="15.4" width="16" height="2.6" rx="1.3" fill="currentColor"/></svg><span>SETTINGS</span></button></div>
  </div>
</div>

<div id="boroSheet" class="ov sheetov">
  <div class="sheet">
    <div class="mhead"><span class="disp">START IN</span><button class="xbtn" data-close="boroSheet">✕</button></div>
    <div id="boros"><button data-b="MANHATTAN">MANHATTAN</button><button data-b="BROOKLYN">BROOKLYN</button><button data-b="QUEENS">QUEENS</button><button data-b="BRONX">THE BRONX</button><button data-b="STATEN ISLAND">STATEN ISLAND</button></div>
  </div>
</div>

<div id="settings" class="ov sheetov">
  <div class="sheet">
    <div class="mhead"><span class="disp">SETTINGS</span><button class="xbtn" data-close="settings">✕</button></div>
    <div class="opts"><button id="optNight">AFTER DARK</button><button id="optSound">SOUND</button><button id="optShadow">SHADOWS</button><button id="optBlur">MOTION BLUR</button></div>
    <div class="tip">Hold LEFT / RIGHT side to steer · both = brake · keys ← → ↓<br>Smash stuff = heat · grab <b style="color:var(--g)">$</b> cash, <b style="color:#2fa8ff">⚡</b> nitro and <b style="color:#ff9f1a">⚙</b> gears for instant repair</div>
  </div>
</div>

<div id="garage" class="ov">
  <div class="gtop"><button id="garBack">◀</button><div class="gt"><b>GARAGE</b><span id="garTier"></span></div><span class="pill">BANK <b id="garBank">$0</b></span></div>

const MPU = 18, LAT0 = 40.71, LON0 = -73.98;
const KX = 84390 / MPU, KZ = 111132 / MPU;
function P(lat, lon) { return [(lon - LON0) * KX, -(lat - LAT0) * KZ]; }
function PL(p) { return P(p[0], p[1]); }

const WX0 = -1500, WZ0 = -1392, WX1 = 1364, WZ1 = 1360, MAP_RES = 2;
const MW = (WX1 - WX0) / MAP_RES | 0, MH = (WZ1 - WZ0) / MAP_RES | 0;
const BORO = new Uint8Array(MW * MH);
const ZONE = new Uint8Array(MW * MH);
const NEARL = new Uint8Array(MW * MH); // 1 where land is within ~4 cells (shore band); built in buildMap
const LANDB = new Uint8Array(MW * MH); // land mask blurred with a 5-tap binomial kernel (0..255); smooth coastlines

function fillPoly(arr, pts, val, landOnly) {
  const n = pts.length; if (n < 3) return;
  const px = new Float64Array(n), py = new Float64Array(n);
  let minY = 1e9, maxY = -1e9;
  for (let i = 0; i < n; i++) {
    px[i] = (pts[i][0] - WX0) / MAP_RES; py[i] = (pts[i][1] - WZ0) / MAP_RES;
    if (py[i] < minY) minY = py[i]; if (py[i] > maxY) maxY = py[i];
  }
  const y0 = Math.max(0, Math.ceil(minY - 0.5)), y1 = Math.min(MH - 1, Math.floor(maxY - 0.5));
  const xs = [];
  for (let y = y0; y <= y1; y++) {
    const yc = y + 0.5; xs.length = 0;
    for (let i = 0, j = n - 1; i < n; j = i++) {
      const ay = py[j], by = py[i];
      if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) xs.push(px[j] + (yc - ay) * (px[i] - px[j]) / (by - ay));
    }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      const xa = Math.max(0, Math.ceil(xs[k] - 0.5)), xb = Math.min(MW - 1, Math.ceil(xs[k + 1] - 0.5) - 1);
      const row = y * MW;
      for (let x = xa; x <= xb; x++) { if (!landOnly || BORO[row + x]) arr[row + x] = val; }
    }
  }
}

}

function gLocal(g, x, z) { const rx = x - g.ox, rz = z - g.oz; return [rx * g.ex + rz * g.ez, rx * g.dx + rz * g.dz]; }
function gWorld(g, u, v) { return [g.ox + u * g.ex + v * g.dx, g.oz + u * g.ez + v * g.dz]; }
function gRect(g, u0, v0, u1, v1) { return [gWorld(g, u0, v0), gWorld(g, u1, v0), gWorld(g, u1, v1), gWorld(g, u0, v1)]; }
function blockOf(g, lat, lon) { const p = P(lat, lon), l = gLocal(g, p[0], p[1]); return [Math.floor(l[0] / g.A), Math.floor(l[1] / g.S)]; }

  const a = g.wa / 2 + g.sw + (inset || 0), b = g.ws / 2 + g.sw + (inset || 0);

const BUCKETS = new Array(BKW * BKH);
function addSeg(a, b, w, type, br) {
  const dx = b[0] - a[0], dz = b[1] - a[1], len = Math.hypot(dx, dz);
  const s = { ax: a[0], az: a[1], bx: b[0], bz: b[1], dx: dx / len, dz: dz / len, len, hw: w / 2, type, br, t0: 0 };
  SEGS.push(s);

  const x0 = Math.floor((Math.min(a[0], b[0]) - r - WX0) / BK), x1 = Math.floor((Math.max(a[0], b[0]) + r - WX0) / BK);
  const z0 = Math.floor((Math.min(a[1], b[1]) - r - WZ0) / BK), z1 = Math.floor((Math.max(a[1], b[1]) + r - WZ0) / BK);
  for (let z = Math.max(0, z0); z <= Math.min(BKH - 1, z1); z++) for (let x = Math.max(0, x0); x <= Math.min(BKW - 1, x1); x++) {
    // conservative: distance from bucket center to segment
    const cx = WX0 + (x + 0.5) * BK, cz = WZ0 + (z + 0.5) * BK;
    let t = (cx - s.ax) * s.dx + (cz - s.az) * s.dz; t = Math.max(0, Math.min(len, t));
    const ddx = cx - (s.ax + s.dx * t), ddz = cz - (s.az + s.dz * t);
    if (Math.hypot(ddx, ddz) > r + BK * 0.75) continue;
    const k = z * BKW + x; (BUCKETS[k] || (BUCKETS[k] = [])).push(s);

    if (street && R() < 0.8) box(x, 0.33, z, w + 0.06, 0.66, d + 0.06, yaw, PAL.awning[Math.floor(R() * PAL.awning.length)], 8);
    const w2 = w * (0.72 + R() * 0.12), d2 = d * (0.72 + R() * 0.12);
    roofCap(x, z, yaw, w, d, h1, glass ? hex('#8c949c') : col);
    if (h > 12.5 && w2 > 2.2) {
      const h2 = h * 0.72;
      box(x, h1 + (h2 - h1) / 2, z, w2, h2 - h1, d2, yaw, c, wm);
      box(x, h2 + (h - h2) / 2, z, w2 * 0.7, h - h2, d2 * 0.7, yaw, c, wm);
      const cw = w2 * 0.7, cd = d2 * 0.7, r = R();
      if (r < 0.35) { // art deco stepped crown + spire

        box(x, h + 0.3, z, cw * 0.7, 0.6, cd * 0.7, yaw, cc, 0);
        box(x, h + 0.85, z, cw * 0.45, 0.5, cd * 0.45, yaw, cc, 0);
        box(x, h + 1.25, z, cw * 0.25, 0.3, cd * 0.25, yaw, cc, 0);
        box(x, h + 2.4, z, 0.1, 2.0, 0.1, yaw, C.silver, 6);
      } else if (r < 0.7) { // mechanical penthouse + antenna
        roofCap(x, z, yaw, cw, cd, h, glass ? hex('#8c949c') : col);
        box(x, h + 0.3, z, cw * 0.45, 0.6, cd * 0.4, yaw, hex('#8d9196'), 0);
        box(x, h + 1.5, z, 0.12, 2.4, 0.12, yaw, C.gray, 0);
      } else { // flat roof with helipad-ish marking

      }
    } else {
      box(x, h1 + (h - h1) / 2, z, w2, h - h1, d2, yaw, c, wm);

      box(x, h + 0.25, z, w2 * 0.35, 0.5, d2 * 0.35, yaw, hex('#8d9196'), 0);
    }
  } else {
    box(x, h / 2, z, w, h, d, yaw, col, 1);

    if (h > 1.8 && w > 0.8) box(x, h - 0.05, z, w + 0.1, 0.14, d + 0.1, yaw, shadeC(col, 0.68), 0);
    else roofCap(x, z, yaw, w, d, h, col);
    if (kind === 'row') { // brownstone stoop

    } else if (street) {

      for (let k = 0; k < nAC; k++) lbox(x, z, yaw, (R() - 0.5) * (w - 0.8), h + 0.2, (R() - 0.5) * (d - 0.8), 0.45, 0.36, 0.38, C.gray, 0);
      if ((b === 1 || b === 3 || b === 2) && h < 9 && R() < 0.3 && w > 1.6) {
        const lx = (R() - 0.5) * (w - 1), lz = (R() - 0.5) * (d - 1);
        for (const sx of [-0.2, 0.2]) for (const sz of [-0.2, 0.2]) lbox(x, z, yaw, lx + sx, h + 0.35, lz + sz, 0.06, 0.7, 0.06, C.wood2, 0);

        lbox(x, z, yaw, lx, h + 1.5, lz, 0.55, 0.25, 0.55, C.wood2, 0);

  }
  addCol(ctx, x, z, yaw, w / 2, d / 2, h);
}

function house(x, z, yaw, w, d, R, ctx) {

  box(x, h / 2, z, bw, h, bd, yaw, col, 4);

  box(x, h + 0.45, z, bw * 0.62, 0.3, bd + 0.15, yaw, rc, 0);

}

// prop types
const PT = { TREE: 1, LAMP: 2, HYDRANT: 3, TRASH: 4, NEWS: 5, BENCH: 6, PCAR: 7, CART: 8, TOMB: 9, UMB: 10, BUSH: 12, CONE: 13 };
const PMASS = [0, 1.0, 0.8, 0.5, 0.25, 0.2, 0.3, 3.0, 0.8, 0.2, 0.1, 0, 0.2, 0.1];
const PRAD = [0, 0.38, 0.22, 0.2, 0.22, 0.2, 0.45, 1.0, 0.5, 0.18, 0.3, 0, 0.4, 0.18];
function prop(ctx, type, x, z, yaw, R) {
  const start = OB.length / INST;
  switch (type) {

      lbox(x, z, yaw, 0, 2.12, 0.5, 0.2, 0.08, 0.24, C.lamp, 5);

    case PT.HYDRANT: box(x, 0.2, z, 0.24, 0.4, 0.24, yaw, C.red); box(x, 0.43, z, 0.16, 0.08, 0.16, yaw, C.red); box(x, 0.25, z, 0.36, 0.08, 0.1, yaw, C.red); break;
    case PT.TRASH: box(x, 0.22, z, 0.3, 0.44, 0.3, yaw, C.dkgreen); break;
    case PT.NEWS: box(x, 0.25, z, 0.3, 0.5, 0.26, yaw, R() < 0.5 ? C.blue : C.red); break;
    case PT.BENCH: box(x, 0.22, z, 0.9, 0.08, 0.32, yaw, C.wood); lbox(x, z, yaw, 0, 0.4, -0.14, 0.9, 0.3, 0.06, C.wood); lbox(x, z, yaw, -0.38, 0.1, 0, 0.06, 0.2, 0.3, C.pole); lbox(x, z, yaw, 0.38, 0.1, 0, 0.06, 0.2, 0.3, C.pole); break;
    case PT.PCAR: { const col = PAL.car[Math.floor(R() * PAL.car.length)]; carBoxes(x, z, yaw, col); break; }
    case PT.CART: box(x, 0.45, z, 0.95, 0.6, 0.55, yaw, C.silver); box(x, 1.25, z, 1.2, 0.08, 1.0, yaw, R() < 0.5 ? C.yellow : C.red); box(x, 0.95, z, 0.05, 0.6, 0.05, yaw, C.pole); break;
    case PT.TOMB: box(x, 0.18, z, 0.28, 0.36, 0.1, yaw, R() < 0.5 ? C.gray : C.concrete); break;
    case PT.UMB: box(x, 0.6, z, 0.06, 1.2, 0.06, 0, C.white); box(x, 1.2, z, 1.1, 0.1, 1.1, yaw, [C.red, C.blue, C.yellow, C.green][Math.floor(R() * 4)]); break;
    case PT.BUSH: box(x, 0.3, z, 0.7, 0.6, 0.7, yaw, PAL.leaf[Math.floor(R() * 4)]); break;
    case PT.CONE: box(x, 0.2, z, 0.25, 0.4, 0.25, 0, C.orange); break;

// parked sedan made of boxes, front = +z local (static, so no raked glass; same proportions as the driven sedan)
function carBoxes(x, z, yaw, col) {

  lbox(x, z, yaw, 0, 0.52, -0.86, 1.02, 0.08, 0.44, col);

  for (const sx of [-0.5, 0.5]) for (const sz of [-0.7, 0.7]) { lbox(x, z, yaw, sx, 0.2, sz, 0.2, 0.4, 0.39, C.tire); lbox(x, z, yaw, sx * 1.21, 0.2, sz, 0.02, 0.25, 0.25, C.silver, 6); }
}

function blockProps(g, b, i, j, uc, vc, bu, bv, R, ctx, yaw) {
  const off = g.sw * 0.62;
  const dense = b === 1 ? 0.55 : b === 5 ? 0.25 : 0.5;
  // sides along u (streets) at v = vc +/- (bv/2 + off)
  for (const sd of [-1, 1]) {
    const v = vc + sd * (bv / 2 + off);
    const n = Math.max(1, Math.floor(bu / 3.2));
    for (let k = 0; k < n; k++) {
      const u = uc - bu / 2 + (k + 0.5) * bu / n + (R() - 0.5) * 0.6;
      const q = gWorld(g, u, v);
      if (tileAt(q[0], q[1]) !== T_WALK || lmExcluded(q[0], q[1], 0.5)) continue;
      const r = R();
      if (r < dense) prop(ctx, PT.TREE, q[0], q[1], 0, R);
      else if (r < dense + 0.08) prop(ctx, b === 1 && R() < 0.5 ? PT.CART : PT.TRASH, q[0], q[1], yaw, R);
      else if (r < dense + 0.13) prop(ctx, PT.NEWS, q[0], q[1], yaw, R);
    }
    // parked cars in the street parking lane
    if (b !== 1 || R() < 0.5) {
      const vp = vc + sd * (bv / 2 + g.sw + 0.62);
      const n2 = Math.max(1, Math.floor(bu / 2.7));
      for (let k = 0; k < n2; k++) {
        if (R() > 0.22) continue;
        const u = uc - bu / 2 + (k + 0.5) * bu / n2;
        const q = gWorld(g, u, vp);
        if (tileAt(q[0], q[1]) !== T_ROAD || lmExcluded(q[0], q[1], 1)) continue;
        // only along streets (not intersections)
        const lu = Math.abs(u - g.A * Math.round(u / g.A)); if (lu < g.wa / 2 + 1.3) continue;
        prop(ctx, PT.PCAR, q[0], q[1], yaw + Math.PI / 2 + (R() < 0.5 ? Math.PI : 0), R);
      }
    }
  }
  // sides along v (avenues): lamps
  for (const sd of [-1, 1]) {
    const u = uc + sd * (bu / 2 + off);
    const n = Math.max(1, Math.floor(bv / 4));
    for (let k = 0; k < n; k++) {
      const v = vc - bv / 2 + (k + 0.5) * bv / n;
      const q = gWorld(g, u, v);
      if (tileAt(q[0], q[1]) !== T_WALK || lmExcluded(q[0], q[1], 0.5)) continue;
      const r = R();
      if (r < 0.45) prop(ctx, PT.LAMP, q[0], q[1], yaw + (sd > 0 ? -Math.PI / 2 : Math.PI / 2), R);
      else if (r < 0.6 && b !== 1) prop(ctx, PT.TREE, q[0], q[1], 0, R);
    }
  }
  // hydrant at a corner
  if (R() < 0.55) {
    const su = R() < 0.5 ? -1 : 1, sv = R() < 0.5 ? -1 : 1;
    const q = gWorld(g, uc + su * (bu / 2 + off), vc + sv * (bv / 2 + off));
    if (tileAt(q[0], q[1]) === T_WALK) prop(ctx, PT.HYDRANT, q[0], q[1], yaw, R);
  }
}

function placeOpenProps(ctx) {
  const R = rng(ihash(ctx.x0 | 0, ctx.z0 | 0, 99));
  // striped lots (LOTS in map.js): parked cars in the stalls + light poles. Busier close to the buildings.
  if (SITE_BOXES) for (const L of LOTS) {
    const q = fLocal(L.F, ctx.x0 + CH / 2, ctx.z0 + CH / 2);
    if (q[0] < L.s0 - 40 || q[0] > L.s1 + 40 || q[1] < L.t0 - 40 || q[1] > L.t1 + 40) continue;
    const mall = !!L.bl, R2 = L.ring;
    for (let s = L.s0 + 0.7; s < L.s1; s += 1.4) for (let b = 0; b * 8.8 + L.tb < L.t1; b++) for (const tb of [1.3, 3.9]) {
      const t = L.tb + b * 8.8 + tb; if (t < L.t0 + 0.6 || t > L.t1 - 1.3) continue;
      const w = fW(L.F, s, t); if (!inChunk(ctx, w[0], w[1]) || tileAt(w[0], w[1]) !== T_PARKING) continue;
      let p = 0.38;
      if (mall) {
        if (R2 && (Math.abs(t - R2.t0) < 2.6 || Math.abs(t - R2.t1) < 2.6 || Math.abs(s - R2.s0) < 2.6 || Math.abs(s - R2.s1) < 2.6 || (Math.abs(Math.abs(s) - 20) < 2.4 && t < R2.t0 + 2))) continue;
        if (L.ex && L.ex.some(e => s > e[0] && s < e[1] && t > e[2] && t < e[3])) continue;
        let dmin = 1e9; for (const m of L.bl) { const ds = Math.max(m[0] - s, 0, s - m[1]), dt = Math.max(m[2] - t, 0, t - m[3]); dmin = Math.min(dmin, Math.hypot(ds, dt)); }
        if (dmin < 1.6) continue; p = 0.06 + 0.6 * Math.exp(-dmin / 12);
      }
      if (ihash(Math.round(s * 10), Math.round(t * 10), mall ? 78 : 77) % 1000 < p * 1000) prop(ctx, PT.PCAR, w[0], w[1], L.F.yaw + (tb < 2 ? Math.PI / 2 : -Math.PI / 2), R);
    }
    if (!mall) for (let s = 9; s < 118; s += 12) { const w = fW(L.F, s, 3.2 + 7.0); if (inChunk(ctx, w[0], w[1])) prop(ctx, PT.LAMP, w[0], w[1], L.F.yaw, R); }
  }
  // site colliders near this chunk, so park/plaza trees never grow inside a real building
  const SC = []; if (SITE_COLS) for (let i = 0; i < SITE_COLS.length; i += 6) { const S = SITE_COLS, r = Math.hypot(S[i + 3], S[i + 4]) + 1;
    if (S[i] + r > ctx.x0 && S[i] - r < ctx.x0 + CH && S[i + 1] + r > ctx.z0 && S[i + 1] - r < ctx.z0 + CH) SC.push(i); }
  const siteHit = (x, z, pad) => { for (const i of SC) { const S = SITE_COLS, c = Math.cos(S[i + 2]), sn = Math.sin(S[i + 2]), dx = x - S[i], dz = z - S[i + 1];
    const lx = dx * c - dz * sn, lz = dx * sn + dz * c; if (Math.abs(lx) < S[i + 3] + pad && Math.abs(lz) < S[i + 4] + pad) return true; } return false; };
  const inCampus = (x, z) => { for (const b of CAMPUS_BB) if (x > b[0] && x < b[2] && z > b[1] && z < b[3]) return true; return false; };
  // parks: jittered lattice
  for (let z = ctx.z0 + 1.6; z < ctx.z0 + CH; z += 3.2) for (let x = ctx.x0 + 1.6; x < ctx.x0 + CH; x += 3.2) {
    const px = x + (R() - 0.5) * 2.2, pz = z + (R() - 0.5) * 2.2, r = R();
    const t = tileAt(px, pz);
    if (t === T_PARK) { if (lmExcluded(px, pz, 1) || (SC.length && siteHit(px, pz, 0.9))) continue; if (inCampus(px, pz)) { if (r < 0.16) prop(ctx, PT.TREE, px, pz, 0, R); else if (r < 0.19) prop(ctx, PT.BENCH, px, pz, R() * 3, R); continue; } if (r < 0.55) prop(ctx, PT.TREE, px, pz, 0, R); else if (r < 0.58) prop(ctx, PT.BENCH, px, pz, R() * 3, R); else if (r < 0.6) prop(ctx, PT.LAMP, px, pz, R() * 6, R); }
    else if (t === T_SAND) { if (lmExcluded(px, pz, 1)) continue; if (r < 0.12) prop(ctx, PT.UMB, px, pz, R(), R); }
    else if (t === T_MARSH) { // reed clumps (decor only: no collider, no heat) away from open pools
      if (r < 0.55 && marshWet(px, pz) < 0.54) { const k = 3 + Math.floor(R() * 4);
        for (let q = 0; q < k; q++) { const rx = px + (R() - 0.5) * 1.4, rz = pz + (R() - 0.5) * 1.4, h = 0.5 + R() * 0.7;
          box(rx, h / 2, rz, 0.07, h, 0.07, R() * 3, R() < 0.5 ? hex('#8f9a4e') : hex('#b3a868'), 0); if (R() < 0.5) box(rx, h, rz, 0.1, 0.2, 0.1, 0, hex('#5a3e24'), 0); } }
    }
    else if (t === T_PLAZA) { if (r < 0.18 && !lmExcluded(px, pz, 2) && !(SC.length && siteHit(px, pz, 0.9))) prop(ctx, PT.TREE, px, pz, 0, R); }
    else if (t === T_CEM) {
      if (r < 0.15) prop(ctx, PT.TREE, px, pz, 0, R);
      else for (let a = 0; a < 2; a++) for (let c = 0; c < 2; c++) if (R() < 0.7) { const tx = px - 0.7 + a * 1.4, tz = pz - 0.7 + c * 1.4; if (tileAt(tx, tz) === T_CEM) prop(ctx, PT.TOMB, tx, tz, 0.2, R); }
    }
  }
}

// ---------- landmarks ----------
const LMY = 0.68;
function vbox(x, y, z, sx, sy, sz, yaw, col, mat) { box(x, y * LMY, z, sx, sy * LMY, sz, yaw, col, mat); }
// quaternion helpers for landmark parts (shared code can't use world.js)
function qy(a) { return [0, Math.sin(a / 2), 0, Math.cos(a / 2)]; }
function qa(x, y, z, a) { const s = Math.sin(a / 2); return [x * s, y * s, z * s, Math.cos(a / 2)]; }
function qm(a, b) { return [a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1], a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0], a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3], a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2]]; }
// square-section beam between two 3D points
function beam(a, b, th, col, mat) {
  const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2], L = Math.hypot(dx, dy, dz);
  const q = qm(qy(Math.atan2(dx, dz)), qa(1, 0, 0, -Math.atan2(dy, Math.hypot(dx, dz))));
  boxQ((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2, th, th, L + th * 0.5, q, col, mat);
}
// Landmarks. Heights are exaggerated vs. the generic city so the skyline reads at a glance.
// mat 9 = art-deco vertical piers (ESB / Chrysler shafts), see BOX_FS. Landmark boxes get +16 on mat
// in genChunk so the slicing shader treats them leniently (they stay recognizable as you drive past).
function buildLandmark(L, ctx) {
  const x = L.x, z = L.z;
  const R = rng(ihash(x | 0, z | 0, 5));
  const gy = GRIDS[boroAt(x, z) || 1] ? -GRIDS[boroAt(x, z) || 1].th : 0;
  const lb = (lx, y, lz, sx, sy, sz, yaw, col, mat) => lbox(x, z, yaw, lx, y, lz, sx, sy, sz, col, mat);
  // like lb, but the part has its own yaw (by) while its position stays in the landmark frame (fy)
  const lr = (fy, lx, y, lz, sx, sy, sz, by, col, mat) => { const p = rot(x, z, fy, lx, lz); box(p[0], y, p[1], sx, sy, sz, by, col, mat); };
  switch (L.type) {
    case 'esb': {

// ---------- main loop ----------
let last = 0, acc = 0, fpsT = 0, fpsN = 0, lowFps = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const t = now / 1000; let dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now; G.t = t;
  const P = G.P;
  if (P) WORLD.update(P.x, P.z);
  if (G.state === 'play') {
    acc += dt; let n = 0;
    while (acc >= 1 / 60 && n < 4) { stepPlay(1 / 60); acc -= 1 / 60; n++; }
    if (n === 4) acc = 0;
    updateWorldRules(dt);
  } else if (G.state === 'over') {
    acc += dt * 0.5; while (acc >= 1 / 60) { G.P.thr = 0; G.P.steer = 0; stepPlay(1 / 60); acc -= 1 / 60; }
  } else if (G.state === 'title') {
    if (Math.floor(t * 4) !== Math.floor((t - dt) * 4)) renderTitle();
  }
  if (G.state !== 'pause') { updateParts(dt); updateBoats(dt); }
  GFX.resize(G.renderScale);
  render(t, dt);
  if (G.state === 'play' || G.state === 'over') {
    if ((fpsN & 1) === 0) drawMini(t);
    updateHUD(t);
    const nc = nearestCopDist(P.x, P.z);
    AUD.update(vSpeed(P), G.stars > 0 ? Math.max(0, 1 - nc / 55) : 0, t, G.state === 'play');
  } else AUD.update(0, 0, t, false);
  if (FPSBOX) fpsOverlay(now, dt);
  // adaptive resolution
  fpsT += dt; fpsN++;
  if (fpsT > 2) {
    const fps = fpsN / fpsT;
    if (G.state === 'play' && !G.noAdapt) {
      // Sharpness first: shadows get cheaper before the picture gets softer, and on retina phones the
      // render scale only drops below 1.5x if the game is genuinely struggling (< 26 fps). A 30 fps cap
      // (iPhone Low Power Mode) therefore settles at 1.5x instead of a blurry 1x. Recovers when fast again.
      const hiFloor = G.maxScale >= 2 ? 1.5 : 1;
      if (fps < 26 && G.renderScale > 1) { G.renderScale = Math.max(1, G.renderScale - 0.25); G.goodN = 0; }
      else if (fps < 50) {
        G.goodN = 0;
        if (GFX.shadowOn && GFX.shadowSize > 1024) GFX.setShadowSize(1024);
        else if (G.renderScale > hiFloor) G.renderScale = Math.max(hiFloor, G.renderScale - 0.25);
      } else if (fps > 57 && G.renderScale < G.maxScale && ++G.goodN >= 3) { G.renderScale = Math.min(G.maxScale, G.renderScale + 0.25); G.goodN = 0; }
    }
    fpsT = 0; fpsN = 0; G.fps = fps;
  }
}

try { if (/[?&]fps\b/.test(location.search)) { FPSBOX = document.createElement('div'); FPSBOX.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);top:calc(4px + env(safe-area-inset-top,0px));z-index:50;font:600 11px/1.35 ui-monospace,Menlo,monospace;color:#fff;background:rgba(0,0,0,.65);padding:4px 8px;border-radius:6px;pointer-events:none;white-space:pre;text-align:center'; document.body.appendChild(FPSBOX); } } catch (e) { }
function fpsOverlay(now, dt) {
  const ms = FPSD.last ? now - FPSD.last : 16.7; FPSD.last = now;
  FPSD.t += ms; FPSD.n++; FPSD.worst = Math.max(FPSD.worst, ms);
  if (FPSD.t < 500) return;
  const fps = 1000 * FPSD.n / FPSD.t, st = GFX.stat || { inst: 0, calls: 0 }, c = GFX.canvas;
  FPSBOX.textContent = `${fps.toFixed(0)} fps · worst ${FPSD.worst.toFixed(0)} ms\n${c.width}×${c.height} @${G.renderScale.toFixed(2)} · shadow ${GFX.shadowOn ? GFX.shadowSize : 'off'}\n${st.inst} boxes · ${st.calls} draws · ${WORLD.chunks.size} chunks`;
  FPSD.t = 0; FPSD.n = 0; FPSD.worst = 0;
}

// ---------- boot ----------
function boot() {
  buildMap(); initWorldData(); initBoats();
  const cv = $('gl');
  let ok = false;
  try { ok = GFX.init(cv); } catch (e) { console.error(e); $('err').textContent = 'Graphics error: ' + e.message; $('err').style.display = 'block'; return; }
  if (!ok) { $('err').innerHTML = 'This game needs WebGL2. Try Safari 15+ or Chrome.'; $('err').style.display = 'block'; return; }
  G.maxScale = Math.min(window.devicePixelRatio || 1, 2); G.renderScale = G.maxScale; G.goodN = 0;
  const mobile = /iPhone|iPad|Android/i.test(navigator.userAgent) || window.innerWidth < 700;
  if (mobile) GFX.setShadowSize(1536);
  GFX.shadowOn = SAVE.shadows; GFX.night = SAVE.night ? 1 : 0;
  BILL_TEX = GFX.makeTex(makeBillboards(), 1024, 1024, false, true);
  ICON_TEX = GFX.makeTex(makeIconAtlas(), 1024, 128, false, true);
  buildVehicleMeshes();
  STATIC_BR = GFX.makeInst(buildBridgeGeometry());
  MAPC = makeMapCanvas();
  const mini = $('mini'); mini.width = mini.height = Math.round(mini.clientWidth * Math.min(2, window.devicePixelRatio || 1)) || 260;
  WORLD.initWorkers($('shared').textContent);
  setupInput(); setupMenus();
  goTitle();
  requestAnimationFrame(frame);
  window.__G = G;
  window.__sim = (sec, steer) => {
    const n = Math.round(sec * 60);
    for (let i = 0; i < n; i++) {
      if (G.state !== 'play') break;
      if (steer !== undefined) { G.input.l = steer < 0; G.input.r = steer > 0; }
      stepPlay(1 / 60); updateWorldRules(1 / 60); updateParts(1 / 60); updateBoats(1 / 60);
    }
    G.input.l = G.input.r = false;
    WORLD.update(G.P.x, G.P.z);
  };
}
window.addEventListener('load', boot);
// Add to Home Screen / offline: only on a real https host (Netlify). Skipped for file:// and sandboxed previews.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { }); });
}
